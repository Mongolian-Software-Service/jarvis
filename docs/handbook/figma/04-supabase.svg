    <path d="M1360 480 L1365.451856792321 492.8948539160404 L1354.548143207679 492.8948539160404 Z" fill="#9aa0a6"/>
    <text x="455" y="804" font-family="Inter" font-size="15" font-weight="500" fill="#5b616e" text-anchor="start">Хөгжүүлж байхдаа мөн энэ рүү холбогдоно</text>
  </g>
