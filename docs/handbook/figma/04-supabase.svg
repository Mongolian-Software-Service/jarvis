<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" fill="none">
  <rect width="1600" height="840" fill="#ffffff"/>
  <g id="garchig">
    <text x="60" y="56" font-family="Inter" font-size="30" font-weight="600" fill="#0f1216" text-anchor="start">Дараа нь — Supabase</text>
    <text x="60" y="84" font-family="Inter" font-size="17" font-weight="400" fill="#9aa0a6" text-anchor="start">Өгөгдөл, нэвтрэлт, файл — хоёр талаас нь хандана</text>
  </g>
  <g id="chinii-computer">
