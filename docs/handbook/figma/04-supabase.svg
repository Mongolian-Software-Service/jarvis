    <rect x="720" y="590" width="320" height="130" rx="16" fill="#e9f6ef" stroke="#2f8f63" stroke-width="2"/>
    <text x="744" y="638" font-family="Inter" font-size="22" font-weight="600" fill="#0f1216" text-anchor="start">Хэрэглэгчид</text>
    <text x="744" y="672" font-family="Inter" font-size="16" font-weight="400" fill="#5b616e" text-anchor="start">Утас, компьютероороо</text>
    <text x="744" y="698" font-family="Inter" font-size="16" font-weight="400" fill="#5b616e" text-anchor="start">сайт руу орно.</text>
  </g>
