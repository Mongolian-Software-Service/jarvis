  <g id="github">
    <rect x="720" y="150" width="320" height="130" rx="16" fill="white" stroke="#dfe3ea" stroke-width="2"/>
    <text x="744" y="198" font-family="Inter" font-size="22" font-weight="600" fill="#0f1216" text-anchor="start">GitHub</text>
