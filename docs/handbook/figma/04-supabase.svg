    <path d="M880 480 L880 590" stroke="#9aa0a6" stroke-width="2.5"/>
    <path d="M880 590 L874.5481432076789 577.1051460839597 L885.4518567923211 577.1051460839597 Z" fill="#9aa0a6"/>
    <path d="M880 480 L885.4518567923211 492.8948539160404 L874.5481432076789 492.8948539160404 Z" fill="#9aa0a6"/>
    <text x="880" y="521" font-family="Inter" font-size="15" font-weight="500" fill="#5b616e" text-anchor="middle">Хүсэлт ба хариу</text>
  </g>
  <g id="supabase">
    <rect x="1200" y="150" width="320" height="330" rx="16" fill="white" stroke="#dfe3ea" stroke-width="2"/>
    <text x="1224" y="198" font-family="Inter" font-size="22" font-weight="600" fill="#0f1216" text-anchor="start">Supabase</text>
    <text x="1224" y="228" font-family="Inter" font-size="15" font-weight="400" fill="#9aa0a6" text-anchor="start">Ард талын бүх зүйл нэг дор</text>

    <rect x="1220" y="250" width="280" height="64" rx="10" fill="#f6f7f9"/>
    <text x="1240" y="278" font-family="Inter" font-size="17" font-weight="600" fill="#0f1216" text-anchor="start">Өгөгдлийн сан</text>
    <text x="1240" y="300" font-family="Inter" font-size="14" font-weight="400" fill="#5b616e" text-anchor="start">Хүснэгт, мөр, багана</text>

    <rect x="1220" y="326" width="280" height="64" rx="10" fill="#f6f7f9"/>
    <text x="1240" y="354" font-family="Inter" font-size="17" font-weight="600" fill="#0f1216" text-anchor="start">Нэвтрэлт</text>
    <text x="1240" y="376" font-family="Inter" font-size="14" font-weight="400" fill="#5b616e" text-anchor="start">Хэн нэвтэрснийг мэднэ</text>

    <rect x="1220" y="402" width="280" height="64" rx="10" fill="#f6f7f9"/>
    <text x="1240" y="430" font-family="Inter" font-size="17" font-weight="600" fill="#0f1216" text-anchor="start">Файл хадгалалт</text>
    <text x="1240" y="452" font-family="Inter" font-size="14" font-weight="400" fill="#5b616e" text-anchor="start">Зураг, видео, PDF</text>
  </g>
  <g id="suum-5-vercel-supabase">
    <path d="M1040 400 L1200 330" stroke="#9aa0a6" stroke-width="2.5"/>
    <path d="M1200 330 L1190.371491885068 340.16325890060307 L1186.0010781195867 330.1737417223605 Z" fill="#9aa0a6"/>
    
    <text x="1120" y="351" font-family="Inter" font-size="15" font-weight="500" fill="#5b616e" text-anchor="middle">Бодит өгөгдөл</text>
