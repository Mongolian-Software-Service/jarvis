    <path d="M880 350 L874.5481432076789 337.1051460839596 L885.4518567923211 337.1051460839596 Z" fill="#9aa0a6"/>
    
    <text x="880" y="301" font-family="Inter" font-size="15" font-weight="500" fill="#5b616e" text-anchor="middle">Автоматаар</text>
  </g>
