<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <rect width="1200" height="410" fill="#ffffff"/>
  <g id="garchig">
    <text x="80" y="56" font-family="Inter" font-size="28" font-weight="600" fill="#0f1216" text-anchor="start">Давталт — бүгд дээр нь давт</text>
    <text x="80" y="84" font-family="Inter" font-size="17" font-weight="400" fill="#9aa0a6" text-anchor="start">Гурав байна уу, гурван зуу байна уу — заавар нь ижил</text>
  </g>
<g id="zuil-1"><rect x="80" y="190" width="240" height="80" rx="14" fill="white" stroke="#dfe3ea" stroke-width="2"/><text x="200" y="238" font-family="Inter" font-size="19" font-weight="400" fill="#0f1216" text-anchor="middle">Захиалга 1</text></g>
<g id="zuil-2"><rect x="360" y="190" width="240" height="80" rx="14" fill="white" stroke="#dfe3ea" stroke-width="2"/><text x="480" y="238" font-family="Inter" font-size="19" font-weight="400" fill="#0f1216" text-anchor="middle">Захиалга 2</text></g>
<g id="zuil-3"><rect x="640" y="190" width="240" height="80" rx="14" fill="white" stroke="#dfe3ea" stroke-width="2"/><text x="760" y="238" font-family="Inter" font-size="19" font-weight="400" fill="#0f1216" text-anchor="middle">Захиалга 3</text></g>
<g id="tsaash"><text x="960" y="238" font-family="Inter" font-size="19" font-weight="400" fill="#9aa0a6" text-anchor="start">… цааш</text></g>
<g id="niiluulegch"><path d="M200 176 C200 130 480 130 480 176" stroke="#5e6ad2" stroke-width="3" fill="none"/><path d="M480 176 l-6 -12 h12 z" fill="#5e6ad2"/><path d="M480 176 C480 130 760 130 760 176" stroke="#5e6ad2" stroke-width="3" fill="none"/><path d="M760 176 l-6 -12 h12 z" fill="#5e6ad2"/><text x="480" y="116" font-family="Inter" font-size="16" font-weight="600" fill="#5e6ad2" text-anchor="middle">гишүүн бүр дээр ижил ажил</text></g>
<g id="hooson"><text x="600" y="330" font-family="Inter" font-size="17" font-weight="400" fill="#9aa0a6" text-anchor="middle">Хоосон байвал юу харагдахыг заавал хэл</text></g>
</svg>
