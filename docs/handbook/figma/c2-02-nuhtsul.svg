<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <rect width="1200" height="410" fill="#ffffff"/>
  <g id="garchig">
    <text x="80" y="56" font-family="Inter" font-size="28" font-weight="600" fill="#0f1216" text-anchor="start">Нөхцөл — замын салаа</text>
    <text x="80" y="84" font-family="Inter" font-size="17" font-weight="400" fill="#9aa0a6" text-anchor="start">«Тийм» тал, «үгүй» тал — хоёуланг нь хэлэх ёстой</text>
  </g>
<g id="asuult"><rect x="80" y="170" width="300" height="80" rx="14" fill="#f6f7f9" stroke="#dfe3ea" stroke-width="2"/><text x="230" y="218" font-family="Inter" font-size="20" font-weight="400" fill="#0f1216" text-anchor="middle">Нэвтэрсэн үү?</text></g>
<g id="tiim-zam"><path d="M392 190 C500 190 500 120 600 120" stroke="#2f8f63" stroke-width="3" fill="none"/><path d="M600 120 l-12 -6 v12 z" fill="#2f8f63"/><text x="500" y="104" font-family="Inter" font-size="16" font-weight="600" fill="#2f8f63" text-anchor="middle">тийм</text></g>
<g id="ugui-zam"><path d="M392 230 C500 230 500 300 600 300" stroke="#9a6c0f" stroke-width="3" fill="none"/><path d="M600 300 l-12 -6 v12 z" fill="#9a6c0f"/><text x="500" y="330" font-family="Inter" font-size="16" font-weight="600" fill="#9a6c0f" text-anchor="middle">үгүй</text></g>
<g id="tiim-hariu"><rect x="612" y="84" width="500" height="74" rx="14" fill="#e9f6ef" stroke="#2f8f63" stroke-width="2"/><text x="640" y="128" font-family="Inter" font-size="19" font-weight="400" fill="#0f1216" text-anchor="start">Хяналтын самбарыг харуулна</text></g>
<g id="ugui-hariu"><rect x="612" y="264" width="500" height="74" rx="14" fill="#fdf5e4" stroke="#9a6c0f" stroke-width="2"/><text x="640" y="308" font-family="Inter" font-size="19" font-weight="400" fill="#0f1216" text-anchor="start">Нэвтрэх хуудас руу илгээнэ</text></g>
