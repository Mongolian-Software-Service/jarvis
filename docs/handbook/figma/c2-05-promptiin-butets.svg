<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" fill="none">
  <rect width="1200" height="410" fill="#ffffff"/>
  <g id="garchig">
    <text x="80" y="56" font-family="Inter" font-size="28" font-weight="600" fill="#0f1216" text-anchor="start">Сайн промптын дөрвөн хэсэг</text>
    <text x="80" y="84" font-family="Inter" font-size="17" font-weight="400" fill="#9aa0a6" text-anchor="start">Дараалал нь ч бас чухал</text>
  </g>
<g id="heseg-1"><rect x="80" y="110" width="1040" height="58" rx="14" fill="#f6f7f9" stroke="#dfe3ea" stroke-width="2"/><text x="110" y="147" font-family="Inter" font-size="19" font-weight="400" fill="#0f1216" text-anchor="start">1 · Юу хийх гэж байна вэ — нэг өгүүлбэрээр</text></g>
<g id="heseg-2"><rect x="80" y="180" width="1040" height="58" rx="14" fill="#f6f7f9" stroke="#dfe3ea" stroke-width="2"/><text x="110" y="217" font-family="Inter" font-size="19" font-weight="400" fill="#0f1216" text-anchor="start">2 · Хэнд зориулсан, ямар нөхцөлд</text></g>
<g id="heseg-3"><rect x="80" y="250" width="1040" height="58" rx="14" fill="#f6f7f9" stroke="#dfe3ea" stroke-width="2"/><text x="110" y="287" font-family="Inter" font-size="19" font-weight="400" fill="#0f1216" text-anchor="start">3 · Юу байх ёстой — дугаарласан жагсаалтаар</text></g>
<g id="heseg-4"><rect x="80" y="320" width="1040" height="58" rx="14" fill="#eef0fd" stroke="#5e6ad2" stroke-width="2"/><text x="110" y="357" font-family="Inter" font-size="19" font-weight="600" fill="#5e6ad2" text-anchor="start">4 · Юуг нь хийх шаардлагагүй — хамгийн чухал нь</text></g>
</svg>
