<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" fill="none">
  <rect width="1600" height="840" fill="#ffffff"/>
  <g id="garchig">
    <text x="60" y="56" font-family="Inter" font-size="30" font-weight="600" fill="#0f1216" text-anchor="start">Дараа нь — GitHub</text>
    <text x="60" y="84" font-family="Inter" font-size="17" font-weight="400" fill="#9aa0a6" text-anchor="start">Ажлын түүх компьютерээс гадна үлдэнэ</text>
  </g>
  <g id="chinii-computer">
    <rect x="60" y="90" width="520" height="420" rx="22" fill="none" stroke="#dfe3ea" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="84" y="124" font-family="Inter" font-size="14" font-weight="600" fill="#9aa0a6" text-anchor="start">ЧИНИЙ КОМПЬЮТЕР</text>
  </g>
  <g id="vs-code">
    <rect x="100" y="150" width="440" height="130" rx="16" fill="#eef0fd" stroke="#5e6ad2" stroke-width="2"/>
    <text x="124" y="198" font-family="Inter" font-size="22" font-weight="600" fill="#5e6ad2" text-anchor="start">VS Code</text>
    <text x="124" y="232" font-family="Inter" font-size="16" font-weight="400" fill="#5b616e" text-anchor="start">Код энд байрлана. Claude энд ажиллана.</text>
    <text x="124" y="258" font-family="Inter" font-size="16" font-weight="400" fill="#5b616e" text-anchor="start">Чи юу хэрэгтэйг хэлж, шалгана.</text>
  </g>
  <g id="terminal">
    <rect x="100" y="330" width="210" height="130" rx="16" fill="#f6f7f9" stroke="#dfe3ea" stroke-width="2"/>
    <text x="124" y="378" font-family="Inter" font-size="22" font-weight="600" fill="#0f1216" text-anchor="start">Терминал</text>
    <text x="124" y="412" font-family="Inter" font-size="16" font-weight="400" fill="#5b616e" text-anchor="start">Тушаал бичих</text>
    <text x="124" y="438" font-family="Inter" font-size="16" font-weight="400" fill="#5b616e" text-anchor="start">цонх</text>
  </g>
  <g id="localhost">
    <rect x="330" y="330" width="210" height="130" rx="16" fill="#f6f7f9" stroke="#dfe3ea" stroke-width="2"/>
    <text x="354" y="378" font-family="Inter" font-size="22" font-weight="600" fill="#0f1216" text-anchor="start">localhost</text>
    <text x="354" y="412" font-family="Inter" font-size="16" font-weight="400" fill="#5b616e" text-anchor="start">Зөвхөн чамд</text>
    <text x="354" y="438" font-family="Inter" font-size="16" font-weight="400" fill="#5b616e" text-anchor="start">харагдана</text>
  </g>
  <g id="suum-1-turshih">
    <path d="M435 280 L435 330" stroke="#9aa0a6" stroke-width="2.5"/>
    <path d="M435 330 L429.5481432076789 317.1051460839596 L440.4518567923211 317.1051460839596 Z" fill="#9aa0a6"/>
    
    
  </g>
  <g id="shosh-turshih"><text x="455" y="312" font-family="Inter" font-size="15" font-weight="500" fill="#5b616e" text-anchor="start">Туршиж харах</text></g>
  <g id="github">
    <rect x="720" y="150" width="320" height="130" rx="16" fill="white" stroke="#dfe3ea" stroke-width="2"/>
    <text x="744" y="198" font-family="Inter" font-size="22" font-weight="600" fill="#0f1216" text-anchor="start">GitHub</text>
    <text x="744" y="232" font-family="Inter" font-size="16" font-weight="400" fill="#5b616e" text-anchor="start">Ажлын түүх, хуулбар.</text>
    <text x="744" y="258" font-family="Inter" font-size="16" font-weight="400" fill="#5b616e" text-anchor="start">Бүх хувилбар энд үлдэнэ.</text>
  </g>
  <g id="suum-2-push">
    <path d="M540 215 L720 215" stroke="#9aa0a6" stroke-width="2.5"/>
    <path d="M720 215 L707.1051460839597 220.4518567923211 L707.1051460839597 209.5481432076789 Z" fill="#9aa0a6"/>
    
    <text x="630" y="201" font-family="Inter" font-size="15" font-weight="500" fill="#5b616e" text-anchor="middle">Кодоо илгээх</text>
  </g>
</svg>
