packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 asks before running a package's install scripts. true = a native build
# we actually need; false = a no-op or funding banner we deliberately skip.
#
# `dtrace-provider` and `protobufjs` used to sit here as `false`. They arrived
# with `eas-cli`, which left with `apps/mobile`, so neither is in the tree any
# more and naming them would only tell the next person to look for an Expo app
# that is not here.
allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - zod@4.6.2
